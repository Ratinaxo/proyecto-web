services:
  db:
    image: mysql:9.0
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - ./db:/usr/src/db
      - mysql_data:/var/lib/mysql
    networks:
      - mynetwork
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: mysql_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000" 
    networks:
      - mynetwork
    volumes:
      - ./backend:/usr/src/backend
    depends_on:  
      - db
    env_file: 
      - ./backend/.env
  frontend:
    build:
      context: ./frontend
    ports:
      - "8100:8100"
    networks:
      - mynetwork
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

    
    
networks:
  mynetwork:
    driver: bridge

volumes:
  mysql_data:
    driver: local